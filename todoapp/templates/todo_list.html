{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-blue-400 py-10 rounded-xl">
    <div class="max-w-4xl mx-auto px-4">

        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                All Todos
            </h1>
        </div>

        {% if tasks %}

            <!-- Todo List -->
            <div class="space-y-4">

                {% for task in tasks %}
                <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200">

                    <div class="flex items-start justify-between gap-4">

                        <!-- Todo Content -->
                        <div class="flex-1">

                            <h2 class="text-xl font-semibold text-gray-800 mb-2">
                                {{ task.title }}
                            </h2>

                            <p class="text-gray-600 mb-3">
                                {{ task.description }}
                            </p>

                            <p class="text-sm text-gray-400 mb-2">
                                Created: {{ task.created_at }}
                            </p>
                    
            <form method="post" action="{% url 'toggle_todo' task.pk %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm {% if task.completed %}btn-success{% else %}btn-outline-secondary{% endif %}">
                    {% if task.completed %}✔ complated{% else %}not completed{% endif %}
                    </button>   
            </form>
                        </div>

                        <!-- Actions -->
                        <div class="flex flex-col gap-2">

                            <a href="{% url 'edit_todo' task.pk %}"
                               class="text-sm bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg text-center transition">
                                Edit
                            </a>

                            <a href="{% url 'delete_todo' task.pk %}"
                               class="text-sm bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-center transition">
                                Delete
                            </a>

                        </div>
                    </div>

                
                </div>
                {% endfor %}

            </div>

        {% else %}

            <!-- Empty State -->
            <div class="bg-white rounded-xl shadow-md p-10 text-center">
                <p class="text-gray-500 text-lg">
                    No todos yet.
                </p>

                <a href="{% url 'add_todo' %}"
                   class="inline-block mt-4 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg transition">
                    Create your first todo
                </a>
            </div>

        {% endif %}

    </div>
</div>
{% endblock %}
