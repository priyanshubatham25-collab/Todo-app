<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>  
<body>
<!-- Navbar -->
<nav class="sticky top-0 z-50 border-b border-white/20 bg-blue-400 shadow-sm backdrop-blur-lg">

    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">

        <!-- Logo -->
        <a href="/"
            class="group flex items-center gap-2">
            <div
                class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 text-lg font-bold text-white shadow-md transition duration-300 group-hover:scale-110 group-hover:rotate-3">
                ✓
            </div>

            <span
                class="text-xl font-bold text-gray-800 transition group-hover:text-blue-600">
                Todo App
            </span>
        </a>

        <!-- Desktop Navigation -->
       
<div class="flex flex-wrap items-center justify-end gap-3">

    <a
        href="{% url 'todo_list' %}"
        class="group flex items-center gap-2 rounded-lg px-4 py-2 font-medium text-gray-600 transition duration-300 hover:bg-blue-50 hover:text-blue-600"
    >
        <span class="transition group-hover:-translate-x-1">
            ←
        </span>
        All List
    </a>

    <a
        href="{% url 'add_todo' %}"
        class="rounded-lg bg-gradient-to-r from-blue-600 to-purple-600 px-5 py-2.5 font-semibold text-white shadow-md transition duration-300 hover:-translate-y-0.5 hover:from-blue-700 hover:to-purple-700 hover:shadow-lg active:translate-y-0"
    >
        + Add Todo
    </a>

</div>


    <!-- Mobile Navigation -->
</nav>


<!-- Main Content -->
<main class="mx-auto min-h-[calc(100vh-80px)] max-w-6xl px-6 py-10">

    {% block content %}
    {% endblock %}

</main>

</body>
</html>
