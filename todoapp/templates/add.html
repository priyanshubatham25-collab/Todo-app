{% extends "base.html" %}
{% block content %}

    <div class="mx-auto max-w-2xl">
        <div class="rounded-xl bg-blue-400 p-8 shadow-md">
            <h1 class="mb-6 text-2xl font-bold text-gray-800">
                Add todo
            </h1>

            <form method="POST" class="space-y-6">
                 {% csrf_token %}
                <div>
                    <label
                        for="title"
                        class="mb-2 block text-sm font-medium text-gray-700"
                    >
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        value="{{title_text}}"
                        name="title"
                        required
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 text-gray-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                        placeholder="Enter your title"
                    >
                </div>

                <div>
                    <label
                        for="description"
                        class="mb-2 block text-sm font-medium text-gray-700"
                    >
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"  
                        rows="6"
                        class="w-full resize-none rounded-lg border border-gray-300 px-4 py-3 text-gray-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                        placeholder="Enter your description"
                    >{{desc_text}}</textarea>
                </div>

                <button
                    class="w-full rounded-lg bg-blue-600 px-5 py-3 font-medium text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Submit
                </button>
            </form>
        </div>
    </div>


{% endblock %}
