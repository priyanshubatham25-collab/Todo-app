{% extends "base.html" %}

{% block content %}

<div class=" flex items-center justify-center px-4">
<div class="w-full max-w-md bg-red-200 rounded-2xl shadow-lg p-8 text-center items-center justify-center ">

    <!-- Warning Icon -->
    <div class="mx-auto flex items-center justify-center w-16 h-16 bg-red-100 rounded-full mb-5">
        <svg class="w-8 h-8 text-red-600"
             fill="none"
             stroke="currentColor"
             viewBox="0 0 24 24">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 9v2m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.69 3 1.73 3z">
            </path>
        </svg>
    </div>

    <!-- Heading -->
    <h2 class="text-2xl font-bold text-gray-800 mb-3">
        Delete Todo?
    </h2>

    <p class="text-gray-500 mb-7">
        Are you sure you want to delete this todo? This action cannot be undone.
    </p>

    <!-- Buttons -->
    <div class="flex items-center justify-center gap-4">

        <form method="post">
            {% csrf_token %}

            <button type="submit"
                    class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg transition duration-200 shadow-sm">
                Delete
            </button>

        </form>

        <a href="{% url 'todo_list' %}"
           class="px-6 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-lg transition duration-200">
            Cancel
        </a>

    </div>

</div>

</div>

{% endblock %}
